<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CityU 选课助手 · 问题反馈">
  <title>问题反馈 · CityU 选课助手</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260807b">
  <style>
    /* 问题反馈专用样式 */
    .feedback-page { max-width: 720px; margin: 0 auto; padding: 32px 24px 80px; }

    .feedback-hero {
      text-align: center;
      margin-bottom: 28px;
      padding: 30px 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: var(--shadow-card);
    }
    .feedback-hero h1 {
      font-size: 24px; font-weight: 900;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .feedback-hero p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .feedback-card {
      margin-bottom: 20px;
      padding: 24px 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: var(--shadow-card);
    }
    .feedback-card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--primary-soft);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .feedback-card-title svg { flex-shrink: 0; }

    .feedback-field { margin-bottom: 16px; }
    .feedback-field:last-child { margin-bottom: 0; }
    .feedback-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .feedback-label .required { color: #e53e3e; margin-left: 2px; }

    .feedback-input,
    .feedback-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 200ms, box-shadow 200ms;
      box-sizing: border-box;
    }
    .feedback-input:focus,
    .feedback-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .feedback-textarea { resize: vertical; min-height: 140px; line-height: 1.6; }

    .feedback-name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .feedback-submit-bar {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 12px;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }
    .feedback-btn {
      padding: 12px 32px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 200ms;
      font-family: inherit;
    }
    .feedback-btn-primary {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: 0 6px 18px rgba(99,102,241,0.35);
    }
    .feedback-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99,102,241,0.45); }
    .feedback-btn-secondary {
      background: var(--card);
      color: var(--primary);
      border: 1.5px solid var(--primary-border);
    }
    .feedback-btn-secondary:hover { background: var(--primary-soft); }

    .feedback-result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .feedback-result-overlay.show { display: flex; }
    .feedback-result-card {
      width: 100%;
      max-width: 520px;
      padding: 28px 24px;
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .feedback-result-card h3 {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .feedback-result-card p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .feedback-result-box {
      width: 100%;
      min-height: 140px;
      max-height: 260px;
      padding: 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.6;
      resize: vertical;
      box-sizing: border-box;
      font-family: 'Cascadia Code', 'Consolas', monospace;
    }
    .feedback-result-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    @media (max-width: 640px) {
      .feedback-page { padding: 20px 14px 60px; }
      .feedback-card { padding: 18px 14px; }
      .feedback-name-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

          <span id="lang-label">中文</span>
        </button>

      <div class="menu-group">
        <span class="menu-group-title">关于</span>
        <a class="menu-item" href="about.html">

  <main class="main-content">
    <div class="feedback-page">
      <div class="feedback-hero">
        <h1 data-i18n="feedback.hero.title">问题反馈</h1>
        <p data-i18n="feedback.hero.line1">发现 Bug、课程数据有误或有任何建议？</p>
        <p data-i18n="feedback.hero.line2">留下你的信息与问题描述，我们会尽快跟进处理。</p>
      </div>

      <form id="feedback-form">
        <!-- 窗口一：姓名 + 专业 -->
        <div class="feedback-card">
          <div class="feedback-card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
            <span data-i18n="feedback.section.info">你的信息</span>
          </div>
          <div class="feedback-name-row">
            <div class="feedback-field">
              <label class="feedback-label" for="fb-name"><span data-i18n="feedback.label.name">姓名</span><span class="required">*</span></label>
              <input class="feedback-input" type="text" id="fb-name" name="name" data-i18n="feedback.placeholder.name" placeholder="请输入你的姓名或昵称" autocomplete="name">
            </div>
            <div class="feedback-field">
              <label class="feedback-label" for="fb-programme"><span data-i18n="feedback.label.programme">专业</span><span class="required">*</span></label>
              <input class="feedback-input" type="text" id="fb-programme" name="programme" data-i18n="feedback.placeholder.programme" placeholder="例如：数据科学硕士 / MSc Data Science" autocomplete="organization-title">
            </div>
          </div>
        </div>

        <!-- 窗口二：问题描述 -->
        <div class="feedback-card">
          <div class="feedback-card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            <span data-i18n="feedback.section.description">问题描述</span>
          </div>
          <div class="feedback-field">
            <label class="feedback-label" for="fb-desc"><span data-i18n="feedback.label.description">请描述你遇到的问题或建议</span><span class="required">*</span></label>
            <textarea class="feedback-textarea" id="fb-desc" name="description" rows="6" data-i18n="feedback.placeholder.description" placeholder="请详细描述问题现象、出现的页面和操作步骤，或写下你的建议…"></textarea>
          </div>
        </div>

        <div class="feedback-submit-bar">
          <button type="button" class="feedback-btn feedback-btn-secondary" data-i18n="feedback.btn.reset" onclick="document.getElementById('feedback-form').reset()">重置</button>
          <button type="submit" class="feedback-btn feedback-btn-primary" data-i18n="feedback.btn.submit">提交反馈</button>
        </div>
      </form>
    </div>
  </main>

  <!-- 结果弹窗 -->
  <div class="feedback-result-overlay" id="result-overlay">
    <div class="feedback-result-card">
      <h3 data-i18n="feedback.result.title">反馈已生成</h3>
      <p data-i18n="feedback.result.desc">请复制以下内容，发送给管理员或提交到 GitHub Issues：</p>
      <textarea class="feedback-result-box" id="result-text" readonly></textarea>
      <div class="feedback-result-actions">
        <button class="feedback-btn feedback-btn-primary" data-i18n="feedback.result.copy" onclick="copyResult()">复制内容</button>
        <a class="feedback-btn feedback-btn-secondary" data-i18n="feedback.result.github" href="https://github.com/Famalhaut04/Cityu-course-selection/issues/new" target="_blank" rel="noopener noreferrer" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">提交到 GitHub</a>
        <button class="feedback-btn feedback-btn-secondary" data-i18n="feedback.result.close" onclick="closeResult()">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/shared.js?v=20260807c"></script>
  <script>
    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    document.getElementById('feedback-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('fb-name').value.trim();
      const programme = document.getElementById('fb-programme').value.trim();
      const description = document.getElementById('fb-desc').value.trim();

      if (!name) { showToast('请填写姓名'); return; }
      if (!programme) { showToast('请填写专业'); return; }
      if (!description) { showToast('请描述你遇到的问题'); return; }

      const lines = [];
      lines.push('═════════════════════════════════');
      lines.push('  CityU 选课助手 · 问题反馈');
      lines.push('  提交时间：' + new Date().toLocaleString('zh-CN'));
      lines.push('═════════════════════════════════');
      lines.push('');
      lines.push('【姓名】' + name);
      lines.push('【专业】' + programme);
      lines.push('');
      lines.push('【问题描述】');
      lines.push(description);
      lines.push('');
      lines.push('═════════════════════════════════');

      document.getElementById('result-text').value = lines.join('\n');
      document.getElementById('result-overlay').classList.add('show');
    });

    function copyResult() {
      const text = document.getElementById('result-text');
      text.select();
      text.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        showToast('已复制到剪贴板');
      } catch (err) {
        showToast('复制失败，请手动选择复制');
      }
    }

    function closeResult() {
      document.getElementById('result-overlay').classList.remove('show');
    }
  </script>
</body>
